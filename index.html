<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Fish Hockey Club</title>
  <meta name="description" content="The Fish Hockey Club — 2026–27 game schedule, next game and team info.">
  <meta name="theme-color" content="#1c1d1f">

  <meta property="og:title" content="The Fish Hockey Club">
  <meta property="og:description" content="Our 2026–27 schedule and next game.">
  <meta property="og:image" content="assets/icon-512.png">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="The Fish">
  <meta name="application-name" content="The Fish">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="The Fish Hockey Club, home">
      <img src="assets/logo.png" alt="" width="60" height="45">
      <span class="brand-text">
        <span class="brand-name">The Fish</span>
        <span class="brand-sub">Hockey Club</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Sections">
      <a href="#schedule">Schedule</a>
      <a href="#tourney">Tourney</a>
      <a href="#legends">Legends</a>
    </nav>
  </header>

  <main id="top">
    <!-- Next game (filled in by js/app.js) -->
    <section class="next-game" id="next-game" aria-live="polite">
      <p class="eyebrow">Next game</p>
      <div class="next-body">
        <p class="next-loading">Loading schedule…</p>
      </div>
    </section>

    <!-- Tournament weekend (filled in by js/tournament.js; hides itself afterwards) -->
    <section class="tourney" id="tourney"></section>

    <section class="schedule" id="schedule">
      <div class="section-head">
        <h2>Schedule <span class="season" id="season"></span></h2>
        <div class="tabs" role="tablist" aria-label="Which games to show">
          <button role="tab" id="tab-ours" aria-selected="true" aria-controls="games" data-view="ours">Our games</button>
          <button role="tab" id="tab-all" aria-selected="false" aria-controls="games" data-view="all">All league</button>
        </div>
      </div>

      <p class="record" id="record" hidden></p>

      <button class="show-past" id="show-past" type="button" hidden></button>
      <div id="games" role="tabpanel" aria-labelledby="tab-ours"></div>

      <div class="cal-all">
        <button class="btn btn-ghost" id="add-all" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3M17 2v3M3.5 9h17M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 19 20.5H5A1.5 1.5 0 0 1 3.5 19V6A1.5 1.5 0 0 1 5 4.5Z"/></svg>
          Add all our games to my calendar
        </button>
        <a class="pdf-link" href="assets/2026-27-schedule.pdf">League schedule (PDF)</a>
      </div>
    </section>

    <section class="legends" id="legends">
      <h2>Legends Board</h2>
      <p class="legends-sub">No names. They know who they are.</p>
      <div id="legends-list"></div>
    </section>

    <section class="team" id="team">
      <h2>The Team</h2>
      <figure>
        <img src="assets/team-wins-2025-26.jpg" alt="Collage of four team photos from our 2025–26 wins, including a trophy win and a Wiarton Willie Weekend Hockey Tournament Champions banner" width="900" height="1604" loading="lazy">
        <figcaption>Every win from last season, 2025–26</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <img src="assets/logo.png" alt="" width="48" height="36" loading="lazy">
    <p>The Fish Hockey Club · Go Fish!</p>
  </footer>

  <script src="js/schedule.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/app.js"></script>
  <script src="js/legends.js"></script>
</body>
</html>
